  /api/facturas/{id}/void:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    put:
      tags: [facturas]
      summary: Void an invoice
      description: |
        Sets `estado` to `N` (anulada), reverses the customer balance by the invoice total,
        creates a tenant-scoped `NotaCredito`, and records `AuditEvent` `factura_void` with motivo
        and `notaCreditoId` in metadata — all in one database transaction. Requires `sales.cancel`
        and module `billing.credit_notes`. When the source invoice has `estadoCae === issued`, the
        credit note CAE is requested asynchronously via AFIP adapter.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidInput'
      responses:
        '200':
          description: Invoice voided with credit note and updated customer balance snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaVoidEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
