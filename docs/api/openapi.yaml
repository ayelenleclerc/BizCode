  /api/contabilidad/libro-iva-ventas:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [contabilidad]
      summary: Libro IVA Ventas export (ARCA RG 3685 — Fase 1)
      description: |
        Generates **Libro IVA Ventas** from persisted `Factura` fiscal fields (types A/B/C, netos, IVA, total, estado).
        Includes credit notes and voided vouchers (`tipo 999`) per ADR-0013 when `NotaCredito` falls in the period.
        Requires module `finance.ledger` and permission `reports.financial.read`.
        Purchases book: see `GET /api/contabilidad/libro-iva-compras` (#306).
        - `format=preview` (default): JSON totals and record counts.
        - `format=txt`: ZIP download with `CBTV.txt` + `ALICUOTAS.txt` (comma-separated, RG 3685 layout).
        - `format=xlsx`: internal review workbook (not an ARCA substitute).
        ARCA validator confirmation may be pending; structural consistency is covered by tests.
      parameters:
        - name: periodo
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-05'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [preview, txt, xlsx]
            default: preview
      responses:
        '200':
          description: Preview JSON or file download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroIvaVentasPreviewEnvelope'
            application/zip:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

