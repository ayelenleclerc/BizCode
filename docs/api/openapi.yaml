  /api/webhooks/woocommerce/{tenantId}:
    post:
      tags: [woocommerce]
      summary: Per-tenant WooCommerce order webhook (#188)
      description: |
        Public per-tenant notifications endpoint (no JWT). WooCommerce posts the order resource
        directly in the body (not an envelope). Validates `x-wc-webhook-signature` (base64
        HMAC-SHA256 of the raw body) against the tenant's `WooCommerceConfig.webhookSecretEncrypted`.
        Responds `200` immediately and applies the order snapshot asynchronously (stock decrement via
        `venta_woocommerce` + Pedido `origen=woocommerce` on `processing`/`completed`; cancellation
        cleanup on `cancelled`/`refunded`/`failed`). Rate-limited per IP.
      security: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
        - name: x-wc-webhook-signature
          in: header
          required: true
          schema:
            type: string
          description: Base64 HMAC-SHA256 of the raw request body, keyed with the tenant webhook secret.
        - name: x-wc-webhook-topic
          in: header
          required: false
          schema:
            type: string
          description: WooCommerce webhook topic (e.g. `order.updated`); defaults to `order.updated` when absent.
        - name: x-wc-webhook-delivery-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCommerceWebhookBody'
      responses:
        '200':
          description: Notification accepted (processing continues asynchronously)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooCommerceWebhookAckEnvelope'
        '400':
          description: Invalid tenantId, missing/invalid signature or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

