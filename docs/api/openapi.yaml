    get:
      tags: [audit]
      summary: List audit events for the authenticated tenant
      description: |
        Read-only list scoped to the session tenant. Requires permission `audit.read`.
        Default page size is **50** rows (maximum **500**). Optional filters restrict by actor, action, resource type, and `createdAt` bounds (`startDate` / `endDate` as ISO-8601 timestamps; inclusive range).
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: query
          description: Filter by author user id (`AuditEvent.userId`)
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          description: Exact match on `AuditEvent.action`
          schema:
            type: string
        - name: resource
          in: query
          description: Exact match on `AuditEvent.resource`
          schema:
            type: string
        - name: startDate
          in: query
          description: Lower bound on `createdAt` (inclusive)
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Upper bound on `createdAt` (inclusive)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Paginated audit events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

