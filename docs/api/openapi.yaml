openapi: 3.1.0
info:
  title: BizCode API
  version: 0.1.0
  description: |
    REST API for BizCode commercial management system.
    Runs as an Express 5 sidecar on localhost:3001.
    Responses use a JSON envelope `{ success: true, data: ... }` except `/api/health`.
    Session authentication is required for protected resources.
    Protected endpoints can optionally receive `x-bizcode-channel` to enforce channel scope authorization.
    All routes accept optional `X-Request-Id` (max 128 characters); invalid or empty values are ignored and a UUID is assigned. The effective id is echoed on every response (`X-Request-Id`; see runtime middleware `correlationId`).
    Interactive documentation (Swagger UI): http://localhost:3001/api-docs/ (same contract as this file).
  contact:
    name: BizCode Team

servers:
  - url: http://localhost:3001
    description: Local development / Tauri sidecar

tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication and session bootstrap
  - name: clientes
    description: Customer management
  - name: articulos
    description: Product management
  - name: rubros
    description: Product categories
  - name: proveedores
    description: Suppliers (master data and CSV import)
  - name: compras
    description: Purchase orders to suppliers (#135)
  - name: recuentos
    description: Physical inventory count (#136)
  - name: repartos
    description: Delivery routes grouping orders (#140)
  - name: logistica
    description: Logistics KPIs and operational reports (#145)
  - name: facturas
    description: Invoice management
  - name: notasCredito
    description: Credit notes (invoice void flow, module billing.credit_notes, #146)
  - name: afip
    description: Argentina AFIP electronic invoicing (CAE; homologación mock in dev)
  - name: pedidos
    description: Commercial orders and quotes (ADR-0009)
  - name: cobros
    description: Customer payment collections
  - name: portal
    description: B2B customer self-service portal (#240)
  - name: mercadopago
    description: Mercado Pago online payments integration (#174+)
  - name: cobranzas
    description: Overdue invoice reminders (#134)
  - name: cheques
    description: Check portfolio — physical and ECHEQ (#231, module fiscal.cheques)
  - name: formasPago
    description: Payment methods
  - name: users
    description: User management (requires users.manage permission)
  - name: chat
    description: Internal chat conversations and messages
  - name: reportes
    description: Financial and operational reports
  - name: contabilidad
    description: Accounting exports — Libro IVA Ventas Fase 1 (#147); Compras out of scope
  - name: dashboard
    description: Operational dashboard summary and historical sales analytics (#138)
  - name: notifications
    description: In-app notifications
  - name: audit
    description: Audit event history (read-only)
  - name: modules
    description: Platform module catalog and feature-flag metadata
  - name: platform
    description: Super-admin platform operations (tenant configuration)

paths:
  /api/auth/setup-owner:
    post:
      tags: [auth]
      summary: Bootstrap first owner account
      description: One-time endpoint to create initial tenant and owner user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupOwnerInput'
      responses:
        '201':
          description: Owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOwnerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Create authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Account locked after too many failed login attempts
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
              example: 0
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      responses:
        '200':
          description: Session revoked (or already missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get authenticated claims
      responses:
        '200':
          description: Current authenticated claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthClaimsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/health:
    get:
      tags: [health]
      summary: Health check
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/metrics:
    get:
      tags: [health]
      summary: In-memory observability metrics
      description: |
        Returns aggregated technical counters kept in process memory.
        This endpoint excludes tenant/user identifiers and client hints.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Aggregated in-memory metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Metrics endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/modules/catalog:
    get:
      tags: [modules]
      summary: Module catalog (feature flags metadata)
      description: |
        Returns the full module catalog with dependency graph metadata, deployment environment,
        and business presets. Does not include tenant-specific enabled modules (see `/api/me/features`).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Module catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCatalogEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/me/features:
    get:
      tags: [modules]
      summary: Enabled modules for current tenant
      description: Returns module and integration keys enabled for the authenticated user's tenant.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Tenant feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFeaturesEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/planes:
    get:
      tags: [platform]
      summary: Public SaaS plan catalog
      description: Lists active subscription plans with limits and feature keys (no authentication required).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanCatalogEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/me/plan:
    get:
      tags: [platform]
      summary: Current tenant SaaS plan and usage
      description: Returns plan limits, enabled plan features, and current usage for the authenticated tenant.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Tenant plan snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPlanSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/superadmin/stats:
    get:
      tags: [platform]
      summary: Platform-wide tenant statistics (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Global platform stats (metadata only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminGlobalStatsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants:
    get:
      tags: [platform]
      summary: List tenants (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant name or slug (case-insensitive)
      responses:
        '200':
          description: Tenant list with aggregate counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [platform]
      summary: Create tenant with default module config (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperadminTenantCreateInput'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantCreateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [platform]
      summary: Tenant detail with platform stats (super admin)
      responses:
        '200':
          description: Tenant metadata and aggregate stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    patch:
      tags: [platform]
      summary: Suspend or reactivate tenant (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperadminTenantPatchInput'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/config:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [platform]
      summary: Get tenant module configuration (super admin)
      responses:
        '200':
          description: Tenant configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    put:
      tags: [platform]
      summary: Update tenant module configuration (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigUpsertBody'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants/{tenantId}/config/history:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
    get:
      tags: [platform]
      summary: Tenant configuration change history (super admin)
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigHistoryEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants/{tenantId}/config/apply-template:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [platform]
      summary: Apply module preset to tenant (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigApplyTemplateBody'
      responses:
        '200':
          description: Configuration after preset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants/{tenantId}/plan:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [platform]
      summary: Change tenant SaaS plan (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPlanChangeBody'
      responses:
        '200':
          description: Updated tenant plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPlanSnapshotEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/pricing:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - name: modules
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated module keys for price preview without persisting
    get:
      tags: [platform]
      summary: Estimated monthly pricing for tenant (super admin)
      responses:
        '200':
          description: Pricing breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPricingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/trials:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [platform]
      summary: List active module trials for tenant (super admin)
      responses:
        '200':
          description: Active trials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantModuleTrialListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    post:
      tags: [platform]
      summary: Activate or extend module trial (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantModuleTrialActivateBody'
      responses:
        '201':
          description: Trial activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantModuleTrialEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/trials/{moduleKey}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - name: moduleKey
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [platform]
      summary: Deactivate module trial (super admin)
      responses:
        '200':
          description: Trial deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantModuleTrialEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Trial not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/clientes:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: List customers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Filter by código, razón social or CUIT (Express query param)
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [clientes]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Customer created (Express returns 200 with body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/import/template:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: Download UTF-8 CSV template for bulk customer import
      responses:
        '200':
          description: CSV with fixed header row and one example data row (UTF-8 BOM)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/import:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [clientes]
      summary: Import customers from a CSV file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV; first row must match the template headers exactly
      responses:
        '200':
          description: Import summary (rows created vs skipped with per-row errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: Get customer by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer or null if not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteNullableEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags: [clientes]
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/BizcodeChannelHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/{id}/cuenta-corriente:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [clientes]
      summary: Customer accounts-receivable statement
      description: Ledger movements, current balance, credit-limit alert, and 6-month debt series (#232). Requires finance.ledger module.
      parameters:
        - name: tipo
          in: query
          schema:
            type: string
            enum: [saldo_inicial, factura, nota_credito, cobro, retencion, percepcion, cheque_rechazado, ajuste]
        - name: desde
          in: query
          description: ISO-8601 filter start (inclusive)
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          description: ISO-8601 filter end (inclusive)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCuentaCorrienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/{id}/cuenta-corriente/saldo:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [clientes]
      summary: Customer accounts-receivable balance only
      responses:
        '200':
          description: Balance snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteCuentaCorrienteSaldoEnvelope'
        '400':
