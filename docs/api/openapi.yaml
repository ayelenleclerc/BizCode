        Requires `sales.cancel`, tenant integration `mercadopago`, and module `billing.credit_notes`.
        Supports **full** and **partial** refunds. Omit `monto` to refund the remaining refundable balance.
        Partial refunds create a partial credit note (#344) without voiding the invoice.
        Full refunds void receipt, invoice, and credit note (#146), setting `mpEstado: refunded`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MercadoPagoRefundInput'
      responses:
        '201':
          description: Refund completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MercadoPagoRefundEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: Partial refund not supported or invoice not eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Mercado Pago refund API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

