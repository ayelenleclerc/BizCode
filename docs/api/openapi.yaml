      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Route started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/ubicacion:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [repartos]
      summary: Record driver GPS position
      description: |
        Requires tenant module `logistics.gps` and permission `orders.deliver.confirm`.
        Only the assigned driver on a reparto in estado `on_route`. Purges locations older than 7 days.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartoUbicacionInput'
      responses:
        '200':
          description: Location recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoUbicacionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/ubicacion/ultima:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: Get last GPS position for a route
      description: |
        Requires tenant module `logistics.gps` and permission `logistics.read`.
        Planners (`owner`, `manager`, `logistics_planner`) on any route; drivers only on their own route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Last recorded position or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoUbicacionNullableEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/cerrar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [repartos]
      summary: Close delivery route
      description: |
        Requires `orders.dispatch`. `on_route` → `completed`; pending items → `not_delivered` and OEs → `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Route closed with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoCloseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    put:
      tags: [repartos]
      summary: Record delivery proof (POD) for a route item
      description: |
        Requires `orders.deliver.confirm`. Route must be `on_route`; item `pending`.
        Driver may only update items on their own route. Delivered outcome requires `receptorNombre` and non-empty `firmaBase64` within size limits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartoItemPodInput'
      responses:
        '200':
          description: Item updated (public fields only; no pod blobs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoItemLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route or item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state, signature, or motivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/items/{itemId}/pod:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: Get full delivery proof for a route item
      description: |
        Requires `logistics.read` and role `owner`, `manager`, or `logistics_planner` (not `driver`).
        Returns signature/photo blobs in `podMedia`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Full POD detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoItemPodEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/logistica/kpis:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [logistica]
      summary: Logistics KPIs for a date range
      description: |
        Aggregated logistics metrics using DB-side queries (#145).
        Requires tenant module `logistics.dispatches` and permission `logistics.read`.
        Optional `choferId` filters all metrics to one driver.
        Uses `OrdenEntrega.dispatchedAt` (ADR-0011) as dispatch baseline.
      security:
        - cookieSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: choferId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: KPI aggregate object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogisticaKpisEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/logistica/reporte-choferes:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [logistica]
      summary: Driver productivity report
      description: |
        Rows grouped by driver and dispatch day. Requires `logistics.dispatches` and `logistics.read`.
        Send `Accept: text/csv` for CSV export.
      security:
        - cookieSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: choferId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Driver rows or CSV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogisticaChoferesListEnvelope'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/logistica/reporte-zonas:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [logistica]
      summary: Delivery coverage by zone
      description: |
        Rows grouped by delivery zone. Requires `logistics.dispatches` and `logistics.read`.
        Send `Accept: text/csv` for CSV export.
      security:
        - cookieSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: choferId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Zone rows or CSV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogisticaZonasListEnvelope'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bizcode_session

  parameters:
    BizcodeChannelHeader:
      name: x-bizcode-channel
      in: header
      required: false
      description: Optional channel scope selector. When provided, it must be allowed by the authenticated user's `claims.scope.channels`.
      schema:
        type: string
        enum: [counter, field, backoffice, warehouse, delivery]

    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied correlation id (trimmed, max 128 chars). Echoed unchanged when valid; otherwise the server substitutes a UUID.
      schema:
        type: string
        maxLength: 128

    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size for list endpoints (default 100, max 500)
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    ListOffset:
      name: offset
      in: query
      required: false
      description: Number of rows to skip before returning results
      schema:
        type: integer
        minimum: 0
        default: 0

    PortalTenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: Tenant slug for portal routes (MVP `/portal/:tenantSlug`)
      schema:
        type: string
        maxLength: 80

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        db:
          type: object
          required: [ok, latencyMs]
          properties:
            ok:
              type: boolean
            latencyMs:
              type: number
              minimum: 0
        uptimeSeconds:
          type: number
          minimum: 0
        version:
          type: string

    MetricsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MetricsSnapshot'

    MetricsSnapshot:
      type: object
      required:
        - startedAt
        - uptimeSeconds
        - appEnv
        - totals
        - requestsByMethod
        - responsesByStatus
        - requestsByRoute
      properties:
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          minimum: 0
        appEnv:
          type: string
        appVersion:
          type: string
          nullable: true
        totals:
          type: object
          required: [requests, errors4xx, errors5xx, averageDurationMs]
          properties:
            requests:
              type: integer
              minimum: 0
            errors4xx:
              type: integer
              minimum: 0
            errors5xx:
              type: integer
              minimum: 0
            averageDurationMs:
              type: number
              minimum: 0
        requestsByMethod:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        responsesByStatus:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        requestsByRoute:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

    ApiErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string

    SetupOwnerInput:
      type: object
      required: [tenantName, tenantSlug, username, password]
      properties:
        tenantName:
          type: string
          minLength: 2
        tenantSlug:
          type: string
          minLength: 2
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    SetupOwnerResult:
      type: object
      required: [tenantId, userId, role]
      properties:
        tenantId:
          type: integer
        userId:
          type: integer
        role:
          type: string

    SetupOwnerEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SetupOwnerResult'

    LoginInput:
      type: object
      required: [tenantSlug, username, password]
      properties:
        tenantSlug:
          type: string
        username:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [userId, tenantId, username, role]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string

    LoginEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LoginResult'

    LogoutResult:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true

    LogoutEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LogoutResult'

    AuthScope:
      type: object
      required: [tenantId, branchIds, warehouseIds, routeIds, channels]
      properties:
        tenantId:
          type: integer
        branchIds:
          type: array
          items:
            type: integer
        warehouseIds:
          type: array
          items:
            type: integer
        routeIds:
          type: array
          items:
            type: integer
        channels:
          type: array
          items:
            type: string

    AuthClaims:
      type: object
      required: [userId, tenantId, username, role, permissions, scope]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/AuthScope'

    AuthClaimsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AuthClaims'

    Cliente:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        codigo:
          type: integer
        rsocial:
          type: string
        fantasia:
          type: string
          nullable: true
        cuit:
          type: string
          nullable: true
        condIva:
          type: string
        domicilio:
          type: string
          nullable: true
        localidad:
          type: string
          nullable: true
        cpost:
          type: string
          nullable: true
        telef:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        activo:
          type: boolean
        creditLimit:
          type: number
          nullable: true
          description: Credit limit in ARS. null = no limit.
        creditDays:
          type: integer
          default: 0
          description: Usual credit days for this customer.
        balance:
          type: number
          default: 0
          description: Accumulated balance (incremented on each new factura).
        balanceInicial:
          type: number
          default: 0
          description: Opening balance at migration time.
        score:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: Payment score 0-100 (50=neutral, 0=high risk, 100=perfect).
        suspended:
          type: boolean
          default: false
          description: When true, POST /api/facturas returns 422 CLIENT_SUSPENDED.
        deliveryZoneId:
          type: integer
          nullable: true
          description: FK to DeliveryZone. Assign a delivery zone to this customer.

    ClienteInput:
      type: object
      required: [codigo, rsocial, condIva, activo]
      properties:
        codigo:
          type: integer
          minimum: 1
        rsocial:
          type: string
          minLength: 3
          maxLength: 30
        fantasia:
          type: string
          maxLength: 30
        cuit:
          type: string
        condIva:
          type: string
          enum: [RI, Mono, CF, Exento]
        domicilio:
          type: string
          maxLength: 40
        localidad:
          type: string
          maxLength: 25
        cpost:
          type: string
          maxLength: 8
        telef:
          type: string
          maxLength: 25
        email:
          type: string
          format: email
        activo:
          type: boolean
        creditLimit:
          type: number
          nullable: true
        creditDays:
          type: integer
          minimum: 0
        suspended:
          type: boolean
        deliveryZoneId:
          type: integer
          nullable: true

    ClienteImportRowError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 2
          description: Data row number in the file (row 1 is the header)
        message:
          type: string

    ClienteImportResult:
      type: object
      required: [created, skipped, errors]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
          description: Rows updated via upsert (legacy DBF migration endpoints)
        skipped:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClienteImportRowError'

    ClienteImportEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ClienteImportResult'

    ListPaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          description: Row count matching the list filter (before limit/offset)
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Effective page size (same semantics as query `limit`)
        offset:
          type: integer
          minimum: 0
          description: Effective skip (same semantics as query `offset`)

    ClienteListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cliente'
        - $ref: '#/components/schemas/ListPaginationMeta'

    ClienteEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Cliente'

    ClienteNullableEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          anyOf:
            - $ref: '#/components/schemas/Cliente'
            - type: 'null'

    Cobro:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        clienteId:
          type: integer
        fecha:
          type: string
          format: date-time
        monto:
          type: number
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          nullable: true
        nota:
          type: string
          nullable: true
        cliente:
          type: object
          additionalProperties: true
          properties:
            id:
              type: integer
            codigo:
              type: integer
            rsocial:
              type: string

    CobroInput:
      type: object
      required: [clienteId, fecha, monto]
      properties:
        clienteId:
          type: integer
          minimum: 1
        fecha:
          type: string
          description: YYYY-MM-DD or ISO-8601
        monto:
          type: number
          exclusiveMinimum: 0
          description: Net amount received (#229); CC decremented by bruto when retenciones present.
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          maxLength: 60
        nota:
          type: string
          maxLength: 200
        retenciones:
          type: array
          items:
            $ref: '#/components/schemas/ReciboPagoRetencionInput'
        chequeId:
          type: integer
          nullable: true
          description: Link existing portfolio check (#231).
        chequeNuevo:
          $ref: '#/components/schemas/ChequeInput'
          description: Create received check when recording collection (#231).

    CobroRetencion:
      type: object
      required: [id, regimenId, regimenNombre, tipo, baseImponible, alicuota, importe]
      properties:
        id:
          type: integer
        regimenId:
          type: integer
        regimenNombre:
          type: string
        tipo:
          type: string
        baseImponible:
          type: string
        alicuota:
          type: string
        importe:
          type: string
        constanciaNum:
          type: string
          nullable: true

    CobroListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cobro'
        - $ref: '#/components/schemas/ListPaginationMeta'

    CobroEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Cobro'

    CobroCreateData:
      type: object
      required: [cobro, updatedCliente, retenciones, montoBruto]
      properties:
        cobro:
          $ref: '#/components/schemas/Cobro'
        updatedCliente:
          type: object
          additionalProperties: true
          required: [id, score]
          properties:
            id:
              type: integer
            rsocial:
              type: string
            balance:
              type: number
            creditLimit:
              type: number
              nullable: true
            score:
              type: integer
              minimum: 0
              maximum: 100
        retenciones:
          type: array
          items:
