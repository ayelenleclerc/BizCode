            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
