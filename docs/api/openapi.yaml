      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCommerceCredentialsInput'
      responses:
        '200':
          description: Credentials verified and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooCommerceConfigStatusEnvelope'
        '400':
          description: Missing/invalid storeUrl, consumerKey or consumerSecret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '502':
          description: WooCommerce verification request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [woocommerce]
      summary: Disconnect WooCommerce (#188)
      description: Requires `settings.business.manage` and tenant integration `woocommerce`. Deletes the local encrypted credentials.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WooCommerceDisconnectEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

