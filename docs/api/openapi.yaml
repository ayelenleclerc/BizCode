          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: estado
        in: query
        schema:
          type: string
          enum: [planificada, en_proceso, completada, cancelada]
      - name: articuloId
        in: query
        schema:
          type: integer
          minimum: 1
      - name: desde
        in: query
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
    get:
      tags: [ordenes-produccion]
      summary: List production orders (#249)
      responses:
        '200':
          description: Paginated production orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [ordenes-produccion]
      summary: Plan a production order from the active BOM formula (#249)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenProduccionCreateInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [ordenes-produccion]
      summary: Get production order by id (#249)
      responses:
        '200':
          description: Production order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}/disponibilidad:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [ordenes-produccion]
      summary: Input availability vs deposit stock minus reservations (#249)
      responses:
        '200':
          description: Availability per input line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionDisponibilidadEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}/iniciar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [ordenes-produccion]
      summary: Start production and reserve mandatory inputs (#249)
      responses:
        '200':
          description: Order in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}/completar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [ordenes-produccion]
      summary: Complete order, consume inputs and credit finished goods (#249)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenProduccionCompletarInput'
      responses:
        '200':
          description: Completed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [ordenes-produccion]
      summary: Cancel order and release reservations (#249)
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/ordenes-produccion/{id}/sugerir-compra:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [ordenes-produccion]
      summary: Create draft purchase order for missing inputs (#249)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proveedorId]
              properties:
                proveedorId:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Draft purchase order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenProduccionSugerirCompraEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/transferencias-deposito/{id}/anular:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [depositos]
      summary: Cancel transfer
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaDepositoEnvelope'
        '422':
          description: Not cancellable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bizcode_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Opaque access token from login/refresh JSON body (`accessToken`). Same validation as `bizcode_session` cookie (#167).
        For `/api/auth/refresh`, the Bearer value may be the refresh token when no cookie/body is sent.

  parameters:
    BizcodeChannelHeader:
      name: x-bizcode-channel
      in: header
      required: false
      description: Optional channel scope selector. When provided, it must be allowed by the authenticated user's `claims.scope.channels`.
      schema:
        type: string
        enum: [counter, field, backoffice, warehouse, delivery]

    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied correlation id (trimmed, max 128 chars). Echoed unchanged when valid; otherwise the server substitutes a UUID.
      schema:
        type: string
        maxLength: 128

    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size for list endpoints (default 100, max 500)
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    ListOffset:
      name: offset
      in: query
      required: false
      description: Number of rows to skip before returning results
      schema:
        type: integer
        minimum: 0
        default: 0

    PortalTenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: Tenant slug for portal routes (MVP `/portal/:tenantSlug`)
      schema:
        type: string
        maxLength: 80

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        db:
          type: object
          required: [ok, latencyMs]
          properties:
            ok:
              type: boolean
            latencyMs:
              type: number
              minimum: 0
        uptimeSeconds:
          type: number
          minimum: 0
        version:
          type: string

    MetricsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MetricsSnapshot'

    MetricsSnapshot:
      type: object
      required:
        - startedAt
        - uptimeSeconds
        - appEnv
        - totals
        - requestsByMethod
        - responsesByStatus
        - requestsByRoute
      properties:
        startedAt:
          type: string
          format: date-time
        uptimeSeconds:
          type: integer
          minimum: 0
        appEnv:
          type: string
        appVersion:
          type: string
          nullable: true
        totals:
          type: object
          required: [requests, errors4xx, errors5xx, averageDurationMs]
          properties:
            requests:
              type: integer
              minimum: 0
            errors4xx:
              type: integer
              minimum: 0
            errors5xx:
              type: integer
              minimum: 0
            averageDurationMs:
              type: number
              minimum: 0
        requestsByMethod:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        responsesByStatus:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        requestsByRoute:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

    ApiErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string

    SetupOwnerInput:
      type: object
      required: [tenantName, tenantSlug, username, password]
      properties:
        tenantName:
          type: string
          minLength: 2
        tenantSlug:
          type: string
          minLength: 2
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    SetupOwnerResult:
      type: object
      required: [tenantId, userId, role]
      properties:
        tenantId:
          type: integer
        userId:
          type: integer
        role:
          type: string

    SetupOwnerEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SetupOwnerResult'

    LoginInput:
      type: object
      required: [tenantSlug, username, password]
      properties:
        tenantSlug:
          type: string
        username:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
          description: When true, refresh cookie TTL is 30 days; otherwise 7 days (#212).

    RefreshInput:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token when cookies are unavailable (mobile/RN, #167).

    RefreshResult:
      type: object
      required: [refreshed, accessToken, refreshToken, expiresIn]
      properties:
        refreshed:
          type: boolean
          const: true
        accessToken:
          type: string
          description: New opaque access token (also set as bizcode_session cookie)
        refreshToken:
          type: string
          description: New opaque refresh token (also set as bizcode_refresh cookie)
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (900 = 15 minutes)
          example: 900

    RefreshEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RefreshResult'

    LoginResult:
      type: object
      required: [userId, tenantId, username, role, accessToken, refreshToken, expiresIn]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string
        accessToken:
          type: string
          description: Opaque access token for Authorization Bearer (also HttpOnly cookie)
        refreshToken:
          type: string
          description: Opaque refresh token for rotation (also HttpOnly cookie)
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    LoginMfaChallenge:
      type: object
      required: [mfaRequired, mfaToken]
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          description: Opaque single-use challenge token (TTL 5 minutes, Redis)

    LoginEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          oneOf:
            - $ref: '#/components/schemas/LoginResult'
            - $ref: '#/components/schemas/LoginMfaChallenge'

    LoginSuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LoginResult'

    MfaVerifyInput:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
        code:
          type: string
          description: 6-digit TOTP or single-use backup code

    MfaCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    MfaSetupStartResult:
      type: object
      required: [otpauthUrl, qrDataUrl, secret]
      properties:
        otpauthUrl:
          type: string
        qrDataUrl:
          type: string
          description: PNG data URL for QR
        secret:
          type: string
          description: Base32 secret for manual entry

    MfaSetupStartEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MfaSetupStartResult'

    MfaSetupConfirmResult:
      type: object
      required: [mfaEnabled, backupCodes]
      properties:
        mfaEnabled:
          type: boolean
          const: true
        backupCodes:
          type: array
          items:
            type: string
          minItems: 8
          maxItems: 8

    MfaSetupConfirmEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MfaSetupConfirmResult'

    MfaStatusResult:
      type: object
      required: [mfaEnabled]
      properties:
        mfaEnabled:
          type: boolean

    MfaStatusEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MfaStatusResult'

    MfaAdminDisableInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          const: false
        code:
          type: string
          description: Required when the caller has MFA enabled

    LogoutResult:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true

    LogoutEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LogoutResult'

    AuthScope:
      type: object
      required: [tenantId, branchIds, warehouseIds, routeIds, channels]
      properties:
        tenantId:
          type: integer
        branchIds:
          type: array
          items:
            type: integer
        warehouseIds:
          type: array
          items:
            type: integer
        routeIds:
          type: array
          items:
            type: integer
        channels:
          type: array
          items:
            type: string

    AuthClaims:
      type: object
      required: [userId, tenantId, username, role, permissions, scope, mfaEnabled, mfaSetupRequired]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/AuthScope'
        mfaEnabled:
          type: boolean
        mfaSetupRequired:
          type: boolean
          description: True when role requires MFA and MFA is not yet enabled (#213)

    AuthClaimsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AuthClaims'

    Cliente:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        codigo:
          type: integer
        rsocial:
          type: string
        fantasia:
          type: string
          nullable: true
        cuit:
          type: string
          nullable: true
        condIva:
          type: string
        domicilio:
          type: string
          nullable: true
        localidad:
          type: string
          nullable: true
        cpost:
          type: string
          nullable: true
        telef:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        activo:
          type: boolean
        anonymizedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when customer PII was irreversibly anonymized (#195)
        creditLimit:
          type: number
          nullable: true
          description: Credit limit in ARS. null = no limit.
        creditDays:
          type: integer
          default: 0
          description: Usual credit days for this customer.
        balance:
          type: number
          default: 0
          description: Accumulated balance (incremented on each new factura).
        balanceInicial:
          type: number
          default: 0
          description: Opening balance at migration time.
        score:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: Payment score 0-100 (50=neutral, 0=high risk, 100=perfect).
        suspended:
          type: boolean
          default: false
          description: When true, POST /api/facturas returns 422 CLIENT_SUSPENDED.
        deliveryZoneId:
          type: integer
          nullable: true
          description: FK to DeliveryZone. Assign a delivery zone to this customer.
        cbu:
          type: string
          nullable: true
          description: Argentine CBU (22 digits) used to match Mercado Pago/bank collections against this customer (#191).
        alias:
          type: string
          nullable: true
          description: Bank alias used to match Mercado Pago/bank collections against this customer (#191).

    ClienteInput:
      type: object
      required: [codigo, rsocial, condIva, activo]
      properties:
        codigo:
          type: integer
          minimum: 1
        rsocial:
          type: string
          minLength: 3
          maxLength: 30
        fantasia:
          type: string
          maxLength: 30
        cuit:
          type: string
        condIva:
          type: string
          enum: [RI, Mono, CF, Exento]
        domicilio:
          type: string
          maxLength: 40
        localidad:
          type: string
          maxLength: 25
        cpost:
          type: string
          maxLength: 8
        telef:
          type: string
          maxLength: 25
        email:
          type: string
          format: email
        activo:
          type: boolean
        creditLimit:
          type: number
          nullable: true
        creditDays:
          type: integer
          minimum: 0
        suspended:
          type: boolean
        deliveryZoneId:
          type: integer
          nullable: true
        cbu:
          type: string
          nullable: true
          pattern: '^[0-9]{22}$'
        alias:
          type: string
          nullable: true
          maxLength: 60

    ClienteImportRowError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 2
          description: Data row number in the file (row 1 is the header)
        message:
          type: string

    ClienteImportResult:
      type: object
      required: [created, skipped, errors]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
          description: Rows updated via upsert (legacy DBF migration endpoints)
        skipped:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClienteImportRowError'

    ClienteImportEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ClienteImportResult'

    ListPaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          description: Row count matching the list filter (before limit/offset)
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Effective page size (same semantics as query `limit`)
        offset:
          type: integer
          minimum: 0
          description: Effective skip (same semantics as query `offset`)

    ClienteListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cliente'
        - $ref: '#/components/schemas/ListPaginationMeta'

    ClienteEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Cliente'

    ClienteNullableEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          anyOf:
            - $ref: '#/components/schemas/Cliente'
            - type: 'null'

    Cobro:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        clienteId:
          type: integer
        fecha:
          type: string
          format: date-time
        monto:
          type: number
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          nullable: true
        nota:
          type: string
          nullable: true
        cliente:
          type: object
          additionalProperties: true
          properties:
            id:
              type: integer
            codigo:
              type: integer
            rsocial:
              type: string

    CobroInput:
      type: object
      required: [clienteId, fecha, monto]
      properties:
        clienteId:
          type: integer
          minimum: 1
        fecha:
          type: string
          description: YYYY-MM-DD or ISO-8601
        monto:
          type: number
          exclusiveMinimum: 0
          description: Net amount received (#229); CC decremented by bruto when retenciones present.
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          maxLength: 60
        nota:
          type: string
          maxLength: 200
        retenciones:
          type: array
          items:
            $ref: '#/components/schemas/ReciboPagoRetencionInput'
        chequeId:
          type: integer
          nullable: true
          description: Link existing portfolio check (#231).
        chequeNuevo:
