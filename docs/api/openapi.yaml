            schema:
              $ref: '#/components/schemas/DeliveryZoneUpdateInput'
      responses:
        '200':
          description: Zone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryZoneEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Zone not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/ordenes-entrega:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [logistics]
      summary: List delivery orders
      description: |
        Requires `logistics.read` or `orders.deliver.confirm`. Drivers only see their own orders
        (`driverId` forced to session user).
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_transit, delivered, failed]
        - name: zonaId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: driverId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: fecha
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Paginated delivery orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEntregaListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [logistics]
      summary: Create a delivery order
      description: Requires `orders.create`. Initial estado is `pending`, or `assigned` when `driverId` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenEntregaCreateInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEntregaEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/ordenes-entrega/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    put:
      tags: [logistics]
      summary: Update delivery order status
      description: |
        Requires `orders.dispatch` for transitions to `assigned`, `in_transit`, or `failed`, and
        `orders.deliver.confirm` for `delivered`. Drivers may only confirm their own `in_transit` orders.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenEntregaUpdateInput'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEntregaEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bizcode_session

  parameters:
    BizcodeChannelHeader:
      name: x-bizcode-channel
      in: header
      required: false
      description: Optional channel scope selector. When provided, it must be allowed by the authenticated user's `claims.scope.channels`.
      schema:
        type: string
        enum: [counter, field, backoffice, warehouse, delivery]

    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied correlation id (trimmed, max 128 chars). Echoed unchanged when valid; otherwise the server substitutes a UUID.
      schema:
        type: string
        maxLength: 128

    ListLimit:
      name: limit
      in: query
      required: false
      description: Page size for list endpoints (default 100, max 500)
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    ListOffset:
      name: offset
      in: query
      required: false
      description: Number of rows to skip before returning results
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ApiErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string

    SetupOwnerInput:
      type: object
      required: [tenantName, tenantSlug, username, password]
      properties:
        tenantName:
          type: string
          minLength: 2
        tenantSlug:
          type: string
          minLength: 2
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    SetupOwnerResult:
      type: object
      required: [tenantId, userId, role]
      properties:
        tenantId:
          type: integer
        userId:
          type: integer
        role:
          type: string

    SetupOwnerEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SetupOwnerResult'

    LoginInput:
      type: object
      required: [tenantSlug, username, password]
      properties:
        tenantSlug:
          type: string
        username:
          type: string
        password:
          type: string

    LoginResult:
      type: object
      required: [userId, tenantId, username, role]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string

    LoginEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LoginResult'

    LogoutResult:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean
          const: true

    LogoutEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LogoutResult'

    AuthScope:
      type: object
      required: [tenantId, branchIds, warehouseIds, routeIds, channels]
      properties:
        tenantId:
          type: integer
        branchIds:
          type: array
          items:
            type: integer
        warehouseIds:
          type: array
          items:
            type: integer
        routeIds:
          type: array
          items:
            type: integer
        channels:
          type: array
          items:
            type: string

    AuthClaims:
      type: object
      required: [userId, tenantId, username, role, permissions, scope]
      properties:
        userId:
          type: integer
        tenantId:
          type: integer
        username:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        scope:
          $ref: '#/components/schemas/AuthScope'

    AuthClaimsEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AuthClaims'

    Cliente:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        codigo:
          type: integer
        rsocial:
          type: string
        fantasia:
          type: string
          nullable: true
        cuit:
          type: string
          nullable: true
        condIva:
          type: string
        domicilio:
          type: string
          nullable: true
        localidad:
          type: string
          nullable: true
        cpost:
          type: string
          nullable: true
        telef:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        activo:
          type: boolean
        creditLimit:
          type: number
          nullable: true
          description: Credit limit in ARS. null = no limit.
        creditDays:
          type: integer
          default: 0
          description: Usual credit days for this customer.
        balance:
          type: number
          default: 0
          description: Accumulated balance (incremented on each new factura).
        balanceInicial:
          type: number
          default: 0
          description: Opening balance at migration time.
        score:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: Payment score 0-100 (50=neutral, 0=high risk, 100=perfect).
        suspended:
          type: boolean
          default: false
          description: When true, POST /api/facturas returns 422 CLIENT_SUSPENDED.
        deliveryZoneId:
          type: integer
          nullable: true
          description: FK to DeliveryZone. Assign a delivery zone to this customer.

    ClienteInput:
      type: object
      required: [codigo, rsocial, condIva, activo]
      properties:
        codigo:
          type: integer
          minimum: 1
        rsocial:
          type: string
          minLength: 3
          maxLength: 30
        fantasia:
          type: string
          maxLength: 30
        cuit:
          type: string
        condIva:
          type: string
          enum: [RI, Mono, CF, Exento]
        domicilio:
          type: string
          maxLength: 40
        localidad:
          type: string
          maxLength: 25
        cpost:
          type: string
          maxLength: 8
        telef:
          type: string
          maxLength: 25
        email:
          type: string
          format: email
        activo:
          type: boolean
        creditLimit:
          type: number
          nullable: true
        creditDays:
          type: integer
          minimum: 0
        suspended:
          type: boolean
        deliveryZoneId:
          type: integer
          nullable: true

    ClienteImportRowError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 2
          description: Data row number in the file (row 1 is the header)
        message:
          type: string

    ClienteImportResult:
      type: object
      required: [created, skipped, errors]
      properties:
        created:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
          description: Rows updated via upsert (legacy DBF migration endpoints)
        skipped:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ClienteImportRowError'

    ClienteImportEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ClienteImportResult'

    ListPaginationMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          description: Row count matching the list filter (before limit/offset)
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Effective page size (same semantics as query `limit`)
        offset:
          type: integer
          minimum: 0
          description: Effective skip (same semantics as query `offset`)

    ClienteListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cliente'
        - $ref: '#/components/schemas/ListPaginationMeta'

    ClienteEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Cliente'

    ClienteNullableEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          anyOf:
            - $ref: '#/components/schemas/Cliente'
            - type: 'null'

    Cobro:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        clienteId:
          type: integer
        fecha:
          type: string
          format: date-time
        monto:
          type: number
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          nullable: true
        nota:
          type: string
          nullable: true
        cliente:
          type: object
          additionalProperties: true
          properties:
            id:
              type: integer
            codigo:
              type: integer
            rsocial:
              type: string

    CobroInput:
      type: object
      required: [clienteId, fecha, monto]
      properties:
        clienteId:
          type: integer
          minimum: 1
        fecha:
          type: string
          description: YYYY-MM-DD or ISO-8601
        monto:
          type: number
          exclusiveMinimum: 0
        formaPagoId:
          type: integer
          nullable: true
        referencia:
          type: string
          maxLength: 60
        nota:
          type: string
          maxLength: 200

    CobroListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
                $ref: '#/components/schemas/Cobro'
        - $ref: '#/components/schemas/ListPaginationMeta'

    CobroEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Cobro'

    CobroCreateData:
      type: object
      required: [cobro, updatedCliente]
      properties:
        cobro:
          $ref: '#/components/schemas/Cobro'
        updatedCliente:
          type: object
          additionalProperties: true
          required: [id, score]
          properties:
            id:
              type: integer
            rsocial:
              type: string
            balance:
              type: number
            creditLimit:
              type: number
              nullable: true
            score:
              type: integer
              minimum: 0
              maximum: 100

    CobroCreateEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CobroCreateData'

    OrdenEntrega:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        facturaId:
          type: integer
          nullable: true
        clienteId:
          type: integer
        zonaId:
          type: integer
          nullable: true
        driverId:
          type: integer
          nullable: true
        fecha:
          type: string
          format: date-time
        estado:
          type: string
          enum: [pending, assigned, in_transit, delivered, failed]
        nota:
          type: string
          nullable: true
        cliente:
          type: object
          additionalProperties: true
        zona:
          type: object
          additionalProperties: true
          nullable: true
        driver:
          type: object
          additionalProperties: true
          nullable: true
        factura:
          type: object
          additionalProperties: true
          nullable: true

    OrdenEntregaCreateInput:
      type: object
      required: [clienteId, fecha]
      properties:
        clienteId:
          type: integer
          minimum: 1
        fecha:
          type: string
        facturaId:
          type: integer
          nullable: true
        zonaId:
          type: integer
          nullable: true
        driverId:
          type: integer
          nullable: true
        nota:
          type: string
          maxLength: 200

    OrdenEntregaUpdateInput:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pending, assigned, in_transit, delivered, failed]
        driverId:
          type: integer
          nullable: true
        zonaId:
          type: integer
          nullable: true
        nota:
          type: string
          maxLength: 200

    OrdenEntregaListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
              items:
