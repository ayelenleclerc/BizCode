        Grouping `agrupar`: `dia` (YYYY-MM-DD), `semana` (Monday of week as YYYY-MM-DD), `mes` (YYYY-MM).
        Requires permission `reports.operational.read`.
        Send `Accept: text/csv` for CSV export (raw CSV body, not JSON envelope).
      security:
        - cookieSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: agrupar
          in: query
          schema:
            type: string
            enum: [dia, semana, mes]
            default: dia
      responses:
        '200':
          description: Sales rows or CSV export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteVentasListEnvelope'
            text/csv:
              schema:
                type: string
