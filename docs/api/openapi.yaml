  /api/dashboard/ventas-historico:
    get:
      tags: [dashboard]
      summary: Historical sales analytics for charts and CSV export (#138)
      description: |
        Aggregates active invoices (`estado = A`) in PostgreSQL by period, top 10 articles, and sales by seller (via linked `Pedido`).
        Requires permission `reports.operational.read`. JSON by default; send `Accept: text/csv` for period series export.
      security:
        - cookieSession: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}-\\d{2}$'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - name: vendedorId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: deliveryZoneId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Aggregated analytics or CSV series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardVentasHistoricoEnvelope'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

