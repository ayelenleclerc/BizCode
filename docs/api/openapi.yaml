      description: |
        Requires `settings.business.manage`. Returns opt-in flags from server env (`FISCAL_PRINTER_ENABLED`, `THERMAL_PRINTER_ENABLED`; default false) and mock channel modes. PDF/legal billing does not require hardware.
      responses:
