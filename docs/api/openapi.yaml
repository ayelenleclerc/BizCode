    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    put:
      tags: [logistics]
      summary: Update delivery order status
      description: |
        Requires `orders.dispatch` for transitions to `assigned`, `in_transit`, or `failed`, and
        `orders.deliver.confirm` for `delivered`. Drivers may only confirm their own `in_transit` orders.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenEntregaUpdateInput'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEntregaEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/ordenes-entrega/{id}/iniciar-picking:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [logistics]
      summary: Start warehouse picking for a delivery order
      description: |
        Requires `orders.pick` and tenant module `logistics.picking`. Transitions `pending` → `picking`
        and assigns the session user as picker. Returns 409 when another user already holds the order in picking.
      responses:
        '200':
          description: Picking started (or idempotent for same picker)
          content:
