      summary: Audit WhatsApp link open or send via Twilio (#265)
      description: |
        Requires `billing.orders` and `orders.create`.
        `canal=link` only writes `AuditEvent` `whatsapp_enviado` (does not require `comms.whatsapp`).
        `canal=twilio` requires module `comms.whatsapp` and configured Twilio; failures do not change pedido state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendBody'
      responses:
        '200':
          description: WhatsApp action recorded / sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppSendEnvelope'
        '400':
          description: Missing phone or Twilio not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          description: Twilio send failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

