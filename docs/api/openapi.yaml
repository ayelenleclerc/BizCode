  /api/repartos:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: List delivery routes
      description: Requires `logistics.read`. Filter by `fecha`, `choferId`, `estado`.
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
        - name: choferId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: estado
          in: query
          schema:
            type: string
            enum: [planned, on_route, completed, cancelled]
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Paginated delivery routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [repartos]
      summary: Create delivery route
      description: |
        Requires `orders.dispatch`. Groups delivery orders in estado `ready`; assigns driver and sets OEs to `assigned`.
        Rejects when an OE is already on an active route (`planned` or `on_route`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartoCreateInput'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Invalid line item or OE already on active route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/activos:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: List on-route deliveries with last GPS position
      description: |
        Requires tenant module `logistics.gps`, permission `logistics.read`, and role
        `owner`, `manager`, or `logistics_planner`. Returns repartos in estado `on_route`
        with `ultimaUbicacion`, `progress`, and `currentStop` (first pending item).
      responses:
        '200':
          description: Active routes for live tracking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoActivoListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: Get delivery route by id
      description: Requires `logistics.read`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Route detail with ordered items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/iniciar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [repartos]
      summary: Start delivery route
      description: |
        Requires `orders.dispatch`. `planned` → `on_route`; pending items' OEs → `in_transit`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Route started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/ubicacion:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [repartos]
      summary: Record driver GPS position
      description: |
        Requires tenant module `logistics.gps` and permission `orders.deliver.confirm`.
        Only the assigned driver on a reparto in estado `on_route`. Purges locations older than 7 days.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartoUbicacionInput'
      responses:
        '200':
          description: Location recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoUbicacionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/ubicacion/ultima:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [repartos]
      summary: Get last GPS position for a route
      description: |
        Requires tenant module `logistics.gps` and permission `logistics.read`.
        Planners (`owner`, `manager`, `logistics_planner`) on any route; drivers only on their own route.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Last recorded position or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoUbicacionNullableEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/cerrar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [repartos]
      summary: Close delivery route
      description: |
        Requires `orders.dispatch`. `on_route` → `completed`; pending items → `not_delivered` and OEs → `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Route closed with summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoCloseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repartos/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    put:
      tags: [repartos]
      summary: Record delivery proof (POD) for a route item
      description: |
        Requires `orders.deliver.confirm`. Route must be `on_route`; item `pending`.
        Driver may only update items on their own route. Delivered outcome requires `receptorNombre` and non-empty `firmaBase64` within size limits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartoItemPodInput'
      responses:
        '200':
          description: Item updated (public fields only; no pod blobs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepartoItemLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Route or item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Invalid state, signature, or motivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

