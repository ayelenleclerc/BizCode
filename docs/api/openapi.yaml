    ArticuloEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Articulo'

    ArticuloNullableEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          anyOf:
            - $ref: '#/components/schemas/Articulo'
            - type: 'null'

    StockAjusteInput:
      type: object
      required: [cantidad, motivo]
      properties:
        cantidad:
          type: integer
        motivo:
          type: string
          minLength: 1
          maxLength: 100

    StockAjusteUser:
      type: object
      properties:
        id:
          type: integer
