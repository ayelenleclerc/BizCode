        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [woocommerce]
      summary: Verify and save WooCommerce Basic Auth credentials (#188)
      description: |
        Requires `settings.business.manage` and tenant integration `woocommerce`. Basic Auth (consumer
        key/secret), not OAuth. Verifies credentials with `GET /products?per_page=1` before persisting
