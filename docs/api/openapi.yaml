        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: monto
        in: query
        required: true
        schema:
          type: number
          exclusiveMinimum: 0
      - name: contexto
        in: query
        schema:
          type: string
          enum: [factura, cobro]
        description: For `entidadTipo=cliente`, `factura` previews perceptions; `cobro` previews withholdings (#229).
      - name: neto1
        in: query
        schema:
          type: number
          minimum: 0
      - name: neto2
        in: query
        schema:
          type: number
          minimum: 0
      - name: neto3
        in: query
        schema:
          type: number
          minimum: 0
    get:
      tags: [contabilidad]
      summary: Preview withholdings/perceptions (#228, #276, #229)
      description: |
        Requires `finance.retenciones`, `reports.financial.read`.
        `entidadTipo=proveedor` — suggested withholdings on supplier payment (#276).
        `entidadTipo=cliente` with `contexto=factura` — perceptions on invoice (neto1+neto2+neto3 base).
        `entidadTipo=cliente` with `contexto=cobro` — customer withholdings on collection (`monto` = bruto).
      responses:
        '200':
          description: Preview result (stub)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetencionesPreviewEnvelope'
