        umedida:
          type: string
          minLength: 2
          maxLength: 6
        precioLista1:
          type: number
          minimum: 0.01
        precioLista2:
          type: number
          minimum: 0.01
        costo:
          type: number
          minimum: 0.01
        stock:
          type: integer
          minimum: 0
        minimo:
          type: integer
          minimum: 0
        activo:
          type: boolean

    ArticuloListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
