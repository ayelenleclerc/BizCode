  /api/documentos-compra/procesar:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [contabilidad]
      summary: Upload purchase document for extraction preview (#277)
      description: |
        Stores the original PDF/image on local filesystem and returns an editable preview.
        **Tier 1:** decodes AFIP/ARCA FE QR locally from embedded PDF URL text or image scan (`jsQR` + `sharp`) — no portal/API verification.
        **Tier 2:** extracts text from digital PDF (`unpdf`) and applies bundled YAML regex templates (Argentina `generic-arca-ar`) when confidence ≥ 0.7.
        **Tier 3:** preprocesses images (`sharp`) and runs local OCR (`tesseract.js`, `spa+eng`), then applies the same templates when confidence ≥ 0.6.
        **Tier 4:** optional local Ollama (`OLLAMA_URL`, model `OLLAMA_MODEL` default `nuextract`) when tiers 1–3 fail.
        Falls back to empty manual preview (tier 0) when extraction fails.
        Requires modules `finance.ledger` and `logistics.purchases`, permission `reports.financial.read`.
        Multipart field `file` — pdf, jpg, png, webp, heic (max 10 MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document stored; preview pending review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoCompraImportadoEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/documentos-compra/procesar-lote:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [contabilidad]
      summary: Batch upload purchase documents for extraction (#277 Phase E)
      description: |
        Processes up to 20 PDF/image files sequentially (same tier pipeline as `procesar`).
        Multipart field `files` — pdf, jpg, png, webp, heic (max 10 MB each).
        Requires `finance.ledger`, `logistics.purchases`, `reports.financial.read`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: All documents stored; previews pending review
