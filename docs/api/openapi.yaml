          type: integer
        codigoBarras:
          type: string
          maxLength: 32
          nullable: true
          description: Optional retail/logistics barcode for seller scan (#255).
        urlThumb:
          type: string
          nullable: true
          description: Principal thumbnail public path (`/uploads/articulos/...`) for seller catalog grid (#257). Null when the article has no image.
        descripcion:
          type: string
        rubroId:
          type: integer
        rubro:
          $ref: '#/components/schemas/Rubro'
        condIva:
          type: string
        umedida:
          type: string
        tipo:
          type: string
          enum: [articulo, servicio]
          description: Catalog item kind (#244). Default articulo.
        unidadServicio:
          type: string
          enum: [hora, dia, mes, proyecto, km, unidad, otro]
          nullable: true
          description: Required when tipo is servicio (#244).
        mesesGarantia:
          type: integer
          nullable: true
          minimum: 1
          description: Warranty months for physical articles; null = no warranty (#251).
        controlLote:
          type: boolean
          description: When true, stock movements require lot tracking / FEFO (#202).
        unidadBase:
          type: string
          enum: [unidad, kg, gramo, litro, metro, m2, m3, rollo, caja]
          description: Base stock/sale unit catalog (#203). Default unidad.
        unidadCompra:
          type: string
          nullable: true
          description: Purchase unit when different from base (#203).
        factorConversion:
          type: number
          description: 1 purchase unit equals factorConversion base units (#203). Default 1.
        multiploVenta:
          type: number
          nullable: true
          description: Optional sale multiple for cut-to-size items (#203).
        pesoKg:
          type: number
          nullable: true
          description: Unit weight in kg for logistics (#203).
        volumenM3:
          type: number
          nullable: true
          description: Unit volume in m3 for logistics (#203).
        precioLista1:
          type: number
        precioLista2:
          type: number
        costo:
          type: number
        stock:
          type: number
          description: Stock quantity in base units; Decimal(14,4) (#203).
        minimo:
          type: number
          description: Minimum stock in base units; Decimal(14,4) (#203).
        activo:
          type: boolean
        monedaPrecio:
          type: string
          enum: [ARS, USD, EUR]
          default: ARS
        precioEnMonedaOrigen:
          type: number
          nullable: true

    ArticuloInput:
      type: object
      required: [codigo, descripcion, rubroId, condIva, umedida, precioLista1, precioLista2, costo, stock, minimo, activo]
      properties:
        codigo:
          type: integer
          minimum: 1
        codigoBarras:
          type: string
          maxLength: 32
          nullable: true
          description: Optional barcode; empty string stored as null (#255).
        descripcion:
          type: string
          minLength: 3
          maxLength: 30
        rubroId:
          type: integer
        condIva:
          type: string
          enum: ['1', '2', '3']
        umedida:
          type: string
          minLength: 2
          maxLength: 6
        tipo:
          type: string
          enum: [articulo, servicio]
          default: articulo
        unidadServicio:
          type: string
          enum: [hora, dia, mes, proyecto, km, unidad, otro]
          nullable: true
        mesesGarantia:
          type: integer
          nullable: true
          minimum: 1
          description: Warranty months; ignored for servicio (#251).
        controlLote:
          type: boolean
          description: Lot control opt-in (#202).
        unidadBase:
          type: string
          enum: [unidad, kg, gramo, litro, metro, m2, m3, rollo, caja]
          description: Base UoM; when set, umedida is derived (#203).
        unidadCompra:
          type: string
          nullable: true
          description: Purchase unit label (#203).
        factorConversion:
          type: number
          exclusiveMinimum: 0
          description: Purchase-to-base conversion factor (#203). Default 1.
        multiploVenta:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Sale multiple/step for cut-to-size (#203).
        pesoKg:
          type: number
          minimum: 0
          nullable: true
        volumenM3:
          type: number
          minimum: 0
          nullable: true
        precioLista1:
          type: number
          minimum: 0.01
        precioLista2:
          type: number
          minimum: 0.01
        costo:
          type: number
          minimum: 0.01
        stock:
          type: number
          minimum: 0
          description: Must be 0 when tipo is servicio (#244). Decimal base units (#203).
        minimo:
          type: number
          minimum: 0
          description: Must be 0 when tipo is servicio (#244). Decimal base units (#203).
        activo:
          type: boolean
        monedaPrecio:
          type: string
          enum: [ARS, USD, EUR]
          default: ARS
          description: Catalog price currency; ARS materializes precioLista1 directly (#243).
        precioEnMonedaOrigen:
          type: number
          nullable: true
          minimum: 0.0001
          description: Required when monedaPrecio is USD or EUR; drives ARS precioLista1 via current TC (#243).

    ArticuloListEnvelope:
      allOf:
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              const: true
            data:
              type: array
