        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [logistics]
      summary: Create a delivery order
      description: Requires `orders.create`. Initial estado is `pending`, or `assigned` when `driverId` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenEntregaCreateInput'
      responses:
