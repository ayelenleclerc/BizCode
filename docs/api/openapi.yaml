            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: agrupar
          in: query
          schema:
            type: string
            enum: [dia, semana, mes]
            default: dia
      responses:
        '200':
          description: Sales rows or CSV export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteVentasListEnvelope'
