openapi: 3.1.0
info:
  title: BizCode API
  version: 0.1.0
  description: |
    REST API for BizCode commercial management system.
    Runs as an Express 5 sidecar on localhost:3001.
    Responses use a JSON envelope `{ success: true, data: ... }` except `/api/health`.
    Session authentication is required for protected resources.
    Protected endpoints can optionally receive `x-bizcode-channel` to enforce channel scope authorization.
    All routes accept optional `X-Request-Id` (max 128 characters); invalid or empty values are ignored and a UUID is assigned. The effective id is echoed on every response (`X-Request-Id`; see runtime middleware `correlationId`).
    Interactive documentation (Swagger UI): http://localhost:3001/api-docs/ (same contract as this file).
  contact:
    name: BizCode Team

servers:
  - url: http://localhost:3001
    description: Local development / Tauri sidecar

tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication and session bootstrap
  - name: clientes
    description: Customer management
  - name: articulos
    description: Product management
  - name: rubros
    description: Product categories
  - name: proveedores
    description: Suppliers (master data and CSV import)
  - name: facturas
    description: Invoice management
  - name: cobros
    description: Customer payment collections
  - name: formasPago
    description: Payment methods
  - name: users
    description: User management (requires users.manage permission)
  - name: chat
    description: Internal chat conversations and messages
  - name: reportes
    description: Financial and operational reports
  - name: dashboard
    description: Operational dashboard summary
  - name: notifications
    description: In-app notifications
  - name: audit
    description: Audit event history (read-only)

paths:
  /api/auth/setup-owner:
    post:
      tags: [auth]
      summary: Bootstrap first owner account
      description: One-time endpoint to create initial tenant and owner user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupOwnerInput'
      responses:
        '201':
          description: Owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOwnerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Create authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Account locked after too many failed login attempts
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
              example: 0
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      responses:
        '200':
          description: Session revoked (or already missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get authenticated claims
      responses:
        '200':
          description: Current authenticated claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthClaimsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/health:
    get:
      tags: [health]
      summary: Health check
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/clientes:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: List customers
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Filter by código, razón social or CUIT (Express query param)
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [clientes]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Customer created (Express returns 200 with body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/import/template:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: Download UTF-8 CSV template for bulk customer import
      responses:
        '200':
          description: CSV with fixed header row and one example data row (UTF-8 BOM)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/import:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [clientes]
      summary: Import customers from a CSV file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV; first row must match the template headers exactly
      responses:
        '200':
          description: Import summary (rows created vs skipped with per-row errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/clientes/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [clientes]
      summary: Get customer by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer or null if not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteNullableEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags: [clientes]
      summary: Update a customer
      parameters:
        - $ref: '#/components/parameters/BizcodeChannelHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteInput'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/articulos:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [articulos]
      summary: List products
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Filter by code or description
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticuloListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [articulos]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticuloInput'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticuloEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/articulos/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [articulos]
      summary: Get product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticuloNullableEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags: [articulos]
      summary: Update a product
      parameters:
        - $ref: '#/components/parameters/BizcodeChannelHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticuloInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticuloEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/articulos/{id}/stock-historial:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [articulos]
      summary: List manual stock adjustments for a product
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Paginated adjustment history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAjusteListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/articulos/{id}/stock-ajuste:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [articulos]
      summary: Apply a manual stock adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAjusteInput'
      responses:
        '200':
          description: Adjustment applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Insufficient stock (INSUFFICIENT_STOCK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/articulos/import/template:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [articulos]
      summary: Download UTF-8 CSV template for bulk product import
      responses:
        '200':
          description: CSV with fixed header row and one example row (UTF-8 BOM)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/articulos/import:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [articulos]
      summary: Import products from CSV (rubroCodigo must match an existing Rubro.codigo)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV; first row must match the template headers exactly
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/articulos/migrate-dbf:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [articulos]
      summary: Import products from legacy ARTICULOS.DBF (rubros must exist first)
      description: Requires `settings.business.manage`. Import `RUBROS.DBF` before `ARTICULOS.DBF`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: FoxPro DBF file (cp437)
      responses:
        '200':
          description: Import summary (created, updated, per-row errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/rubros:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [rubros]
      summary: List product categories
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubroListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [rubros]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubroInput'
      responses:
        '200':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubroEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/rubros/import/template:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [rubros]
      summary: Download UTF-8 CSV template for bulk category import
      responses:
        '200':
          description: CSV with fixed header row and one example row (UTF-8 BOM)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/rubros/import:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [rubros]
      summary: Import product categories from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/rubros/migrate-dbf:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [rubros]
      summary: Import product categories from legacy RUBROS.DBF
      description: Requires `settings.business.manage`. Upserts by tenant and codigo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: FoxPro DBF file (cp437)
      responses:
        '200':
          description: Import summary (created, updated, per-row errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/proveedores:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [proveedores]
      summary: List suppliers
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Supplier list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [proveedores]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorInput'
      responses:
        '200':
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/proveedores/import/template:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [proveedores]
      summary: Download UTF-8 CSV template for bulk supplier import
      responses:
        '200':
          description: CSV with fixed header row and one example row (UTF-8 BOM)
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/proveedores/import:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    post:
      tags: [proveedores]
      summary: Import suppliers from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteImportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/proveedores/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [proveedores]
      summary: Get supplier by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Supplier or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorNullableEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags: [proveedores]
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorInput'
      responses:
        '200':
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/facturas:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [facturas]
      summary: List invoices
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: List of invoices with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaListEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
