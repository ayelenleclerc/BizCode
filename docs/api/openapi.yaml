openapi: 3.1.0
info:
  title: BizCode API
  version: 0.1.0
  description: |
    REST API for BizCode commercial management system.
    Runs as an Express 5 sidecar on localhost:3001.
    Responses use a JSON envelope `{ success: true, data: ... }` except `/api/health`.
    Session authentication is required for protected resources.
    Protected endpoints can optionally receive `x-bizcode-channel` to enforce channel scope authorization.
    All routes accept optional `X-Request-Id` (max 128 characters); invalid or empty values are ignored and a UUID is assigned. The effective id is echoed on every response (`X-Request-Id`; see runtime middleware `correlationId`).
    Interactive documentation (Swagger UI): http://localhost:3001/api-docs/ (same contract as this file).
  contact:
    name: BizCode Team

servers:
  - url: http://localhost:3001
    description: Local development / Tauri sidecar

tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication and session bootstrap
  - name: clientes
    description: Customer management
  - name: articulos
    description: Product management
  - name: rubros
    description: Product categories
  - name: proveedores
    description: Suppliers (master data and CSV import)
  - name: compras
    description: Purchase orders to suppliers (#135)
  - name: recuentos
    description: Physical inventory count (#136)
  - name: repartos
    description: Delivery routes grouping orders (#140)
  - name: logistica
    description: Logistics KPIs and operational reports (#145)
  - name: facturas
    description: Invoice management
  - name: notasCredito
    description: Credit notes (invoice void flow, module billing.credit_notes, #146)
  - name: afip
    description: Argentina AFIP electronic invoicing (CAE; homologación mock in dev)
  - name: fiscal
    description: Multi-organism fiscal e-invoicing — provider config, capabilities and document authorization (#378, ADR-0018)
  - name: payments
    description: Multi-provider online payments — provider config, capabilities and checkout (#377, ADR-0019); Mercado Pago is the only live adapter today
  - name: pedidos
    description: Commercial orders and quotes (ADR-0009)
  - name: visitas
    description: Field seller daily visit agenda (#170)
  - name: feriados
    description: Tenant holiday calendar for seller routes (#267)
  - name: vendedor-zonas
    description: Seller to delivery-zone assignment (#267)
  - name: rutas
    description: Ordered daily seller route planning (#267)
  - name: contratos
    description: Recurring service contracts and scheduled invoicing (#245, module service.contracts)
  - name: ordenes-trabajo
    description: Service work orders / repair tickets (#246, module service.orders)
  - name: garantias
    description: Product warranties by serial / IMEI (#251, module service.warranties)
  - name: fidelizacion
    description: Customer loyalty points program (#250, module clients.loyalty)
  - name: lotes
    description: FEFO inventory lots and expiry alerts (#202, modules inventory.fefo / inventory.lots)
  - name: cajas
    description: Cash drawers and cashier shifts (#247, module pos.cashier)
  - name: listas-precios
    description: Customer price lists with quantity-tiered pricing (#234, module catalog.pricelists)
  - name: categorias-articulo
    description: Hierarchical article categories and attributes for variants (#235, module catalog.variants)
  - name: depositos
    description: Multi-warehouse deposits and transfers (#236, module inventory.warehouses)
  - name: comisiones
    description: Seller commissions configuration and monthly settlements (#237, module finance.commissions)
  - name: importaciones
    description: Bulk Excel/CSV import jobs with dry-run and SSE progress (#238, module platform.data_import)
  - name: tipos-cambio
    description: Exchange rates and FX catalog pricing (#243, module catalog.multicurrency)
  - name: formulas-produccion
    description: Production BOM formulas (#248, module production.bom)
  - name: ordenes-produccion
    description: Production orders consuming BOM inputs (#249, module production.orders)
  - name: cobros
    description: Customer payment collections
  - name: portal
    description: B2B customer self-service portal (#240)
  - name: mercadopago
    description: Mercado Pago online payments integration (#174+)
  - name: meli
    description: Mercado Libre OAuth connection per tenant (#183)
  - name: tiendanube
    description: Tiendanube OAuth, catalog, orders and webhooks per tenant (#187)
  - name: woocommerce
    description: WooCommerce REST API (Basic Auth consumer key/secret), catalog, orders and webhooks per tenant (#188)
  - name: ecommerce
    description: Shared ecommerce sync engine — connectors and SyncLog (#189)
  - name: cobranzas
    description: Overdue invoice reminders (#134)
  - name: cheques
    description: Check portfolio — physical and ECHEQ (#231, module fiscal.cheques)
  - name: bancos
    description: Bank accounts and statement import (#190, module finance.bank_reconcile)
  - name: formasPago
    description: Payment methods
  - name: users
    description: User management (requires users.manage permission)
  - name: chat
    description: Internal chat conversations and messages
  - name: reportes
    description: Financial and operational reports
  - name: contabilidad
    description: Accounting exports — Libro IVA Ventas Fase 1 (#147); Compras out of scope
  - name: dashboard
    description: Operational dashboard summary and historical sales analytics (#138)
  - name: notifications
    description: In-app notifications
  - name: audit
    description: Audit event history (read-only)
  - name: modules
    description: Platform module catalog and feature-flag metadata
  - name: platform
    description: Super-admin platform operations (tenant configuration)

paths:
  /api/auth/setup-owner:
    post:
      tags: [auth]
      summary: Bootstrap first owner account
      description: One-time endpoint to create initial tenant and owner user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupOwnerInput'
      responses:
        '201':
          description: Owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupOwnerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Create authenticated session (cookies + Bearer tokens for RN) or MFA challenge (#213, #167)
      description: >
        Issues HttpOnly cookies (`bizcode_session`, `bizcode_refresh`) for browser clients and
        returns the same opaque tokens in the JSON body (`accessToken`, `refreshToken`, `expiresIn`)
        for mobile/RN clients that persist them in secure storage (#167). Cookies alone remain sufficient for web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: >
            Session created (Set-Cookie + token fields in body) when MFA is off; or MFA challenge payload without cookies when mfaRequired.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Access and refresh HttpOnly cookies (#212) — omitted when mfaRequired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '429':
          description: Account locked after too many failed login attempts
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              example: 5
            X-RateLimit-Remaining:
              schema:
                type: integer
              example: 0
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Complete MFA login challenge with TOTP or backup code (#213)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyInput'
      responses:
        '200':
          description: Session cookies issued after successful MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired challenge / invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/auth/mfa/setup/start:
    post:
      tags: [auth]
      summary: Start MFA enrollment (returns otpauth URI, QR, secret) (#213)
      security:
        - cookieSession: []
      responses:
        '200':
          description: Enrollment material for authenticator app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupStartEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/mfa/setup/confirm:
    post:
      tags: [auth]
      summary: Confirm MFA enrollment with first TOTP code; returns backup codes once (#213)
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeInput'
      responses:
        '200':
          description: MFA enabled; backup codes shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupConfirmEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/auth/mfa/disable:
    post:
      tags: [auth]
      summary: Disable own MFA with TOTP or backup code (#213)
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeInput'
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and issue a new access+refresh pair (#212, #167)
      description: >
        Accepts refresh via `bizcode_refresh` cookie, JSON body `refreshToken`, or `Authorization: Bearer <refreshToken>`.
        Reuse of a revoked refresh token invalidates the whole token family.
        Response includes new cookies and Bearer token fields for RN clients.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: New access and refresh cookies/tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshEnvelope'
        '401':
          description: Refresh missing, expired, or reuse detected (SESSION_EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      description: >
        Revokes using refresh cookie, body `refreshToken`, and/or access cookie / `Authorization: Bearer <accessToken>` (#167).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Session revoked (or already missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get authenticated claims
      security:
        - cookieSession: []
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthClaimsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/health:
    get:
      tags: [health]
      summary: Health check
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/metrics:
    get:
      tags: [health]
      summary: In-memory observability metrics
      description: |
        Returns aggregated technical counters kept in process memory.
        This endpoint excludes tenant/user identifiers and client hints.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Aggregated in-memory metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Metrics endpoint disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/modules/catalog:
    get:
      tags: [modules]
      summary: Module catalog (feature flags metadata)
      description: |
        Returns the full module catalog with dependency graph metadata, deployment environment,
        and business presets. Does not include tenant-specific enabled modules (see `/api/me/features`).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Module catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCatalogEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/me/features:
    get:
      tags: [modules]
      summary: Enabled modules for current tenant
      description: Returns module and integration keys enabled for the authenticated user's tenant.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Tenant feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFeaturesEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/planes:
    get:
      tags: [platform]
      summary: Public SaaS plan catalog
      description: Lists active subscription plans with limits and feature keys (no authentication required).
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Plan catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanCatalogEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/me/plan:
    get:
      tags: [platform]
      summary: Current tenant SaaS plan and usage
      description: Returns plan limits, enabled plan features, and current usage for the authenticated tenant.
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Tenant plan snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPlanSnapshotEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/superadmin/stats:
    get:
      tags: [platform]
      summary: Platform-wide tenant statistics (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Global platform stats (metadata only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminGlobalStatsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/security-events:
    get:
      tags: [platform]
      summary: Security events timeline for the last 24h (super admin) (#221)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
          description: Lookback window in hours (default 24, max 168)
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, info]
          description: Optional severity filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Classified security audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminSecurityEventsEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants:
    get:
      tags: [platform]
      summary: List tenants (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant name or slug (case-insensitive)
      responses:
        '200':
          description: Tenant list with aggregate counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantListEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [platform]
      summary: Create tenant with default module config (super admin)
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperadminTenantCreateInput'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantCreateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [platform]
      summary: Tenant detail with platform stats (super admin)
      responses:
        '200':
          description: Tenant metadata and aggregate stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    patch:
      tags: [platform]
      summary: Suspend or reactivate tenant (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuperadminTenantPatchInput'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/revoke-all-sessions:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [platform]
      summary: Revoke all sessions for every user of a tenant (incident response #222)
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [revokedUserCount]
                    properties:
                      revokedUserCount:
                        type: integer
                        minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/disable:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [platform]
      summary: Disable tenant and revoke sessions (incident response #222)
      responses:
        '200':
          description: Tenant disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/maintenance:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      tags: [platform]
      summary: Enable or disable tenant maintenance mode (incident response #222)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Maintenance mode updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuperadminTenantDetailEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
    get:
      tags: [platform]
      summary: Forensic audit event listing for a tenant (incident response #222)
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                type: object
                required: [success, data, total, limit, offset]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                  offset:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/superadmin/tenants/{tenantId}/config:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      tags: [platform]
      summary: Get tenant module configuration (super admin)
      responses:
        '200':
          description: Tenant configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
    put:
      tags: [platform]
      summary: Update tenant module configuration (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfigUpsertBody'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/superadmin/tenants/{tenantId}/config/history:
    parameters:
