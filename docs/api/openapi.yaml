    post:
      tags: [woocommerce]
      summary: Re-verify already-saved WooCommerce credentials (#188)
      description: Requires `settings.business.manage` and tenant integration `woocommerce`. Health check against `GET /products?per_page=1`; no body.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Credentials still valid
          content:
            application/json:
              schema:
