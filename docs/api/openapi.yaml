        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacturaPrintInput'
      responses:
        '200':
          description: Printing workflow executed (or PDF fallback resolved)
          content:
