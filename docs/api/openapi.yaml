  /api/cobros:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [cobros]
      summary: List customer payments
      parameters:
        - name: clienteId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: desde
          in: query
          schema:
            type: string
            format: date
          description: Filter fecha >= (YYYY-MM-DD or ISO-8601)
        - name: hasta
          in: query
          schema:
            type: string
            format: date
          description: Filter fecha <= end of day
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Paginated list of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobroListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [cobros]
      summary: Register a customer payment
      description: |
        Decrements `Cliente.balance` by bruto (`monto` neto + sum of `retenciones[]` when present) in the same transaction (#229).
        When the customer has at least one active invoice (`estado: A`), adjusts `Cliente.score` from the oldest active invoice due date
        (`factura.fecha + creditDays`) vs payment date: on-time +5; 1–10 days late −3; 11–30 −7; >30 −15.
        No score change when there is no active invoice (on-account payment). Audit metadata includes
        `scoreBefore`, `scoreAfter`, `delta`. Requires `sales.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CobroInput'
      responses:
        '200':
          description: Payment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CobroCreateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Client suspended or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cobros/{id}:
    parameters:
      - $ref: '#/components/parameters/BizcodeChannelHeader'
    get:
      tags: [cobros]
      summary: Get payment by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
