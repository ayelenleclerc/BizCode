  /api/webhooks/mercadopago:
    post:
      tags: [mercadopago]
      summary: Mercado Pago payment webhook (#176)
      description: |
        Public IPN endpoint (no JWT). Validates `x-signature` with the tenant `webhookSecret` from Mercado Pago configuration (#174).
        Responds `200` immediately and processes the payment asynchronously: on `approved`, creates a customer receipt (`ReciboCobro`) with `mercadopago` payment method and invoice allocation; updates `Factura.mpEstado`.
        Chargeback notifications (`type: chargebacks`) enqueue `MercadoPagoChargeback` and notify managers; no automatic credit note (#179).
        Idempotent per `mpPaymentId` (`MercadoPagoProcessedPayment`) for payment events. Rate-limited per IP.
      security: []
      parameters:
        - name: data.id
          in: query
          required: false
          schema:
            type: string
          description: Payment id from Mercado Pago (also present in JSON body `data.id`).
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
          description: Mercado Pago HMAC signature (`ts=...;v1=...`).
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MercadoPagoWebhookBody'
      responses:
        '200':
          description: Notification accepted (processing may continue asynchronously)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MercadoPagoWebhookAckEnvelope'
        '400':
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/webhooks/meli:
    post:
      tags: [meli]
      summary: Mercado Libre notifications webhook (#185)
      description: |
        Public notifications endpoint (no JWT). Validates `x-signature` with platform env `MELI_WEBHOOK_SECRET`
        (HMAC-SHA256 manifest `id:{dataId};request-id:{x-request-id};ts:{ts};`, same family as Mercado Pago docs).
        Responds `200` immediately and processes asynchronously:
        - topic `orders_v2` / `orders`: re-fetches the ML order into `MeliOrden`, applies paid (stock once + Pedido `origen=meli`)
          or cancelled transitions (#186). `MeliWebhookEvent` is an audit log; duplicate `(topic, resource)` does **not**
          block order status updates.
        - topic `items` / `item_price`: alerts managers if remote price diverges from BizCode (no auto-correct).
        Rate-limited per IP.
      security: []
      parameters:
        - name: data.id
          in: query
          required: false
          schema:
            type: string
          description: Resource id used in signature manifest (falls back to id extracted from body `resource`).
        - name: x-signature
          in: header
          required: true
          schema:
            type: string
          description: Mercado Libre HMAC signature (`ts=...,v1=...`).
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeliWebhookBody'
      responses:
        '200':
          description: Notification accepted (processing may continue asynchronously)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeliWebhookAckEnvelope'
        '400':
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/webhooks/tiendanube:
    post:
      tags: [tiendanube]
      summary: Tiendanube notifications webhook (#187)
      description: |
        Public notifications endpoint (no JWT). Validates `x-linkedstore-hmac-sha256` with
        `TIENDANUBE_WEBHOOK_SECRET` or `TIENDANUBE_CLIENT_SECRET` (HMAC-SHA256 of raw body, hex).
        Responds `200` immediately and processes asynchronously:
        - `order/paid` / `order/cancelled`: re-fetches the TN order into `TiendanubeOrden`, applies paid
          (stock once via `venta_tiendanube` + Pedido `origen=tiendanube`) or cancelled transitions.
        - `app/uninstalled`: deletes local `TiendanubeConfig`.
        Rate-limited per IP.
      security: []
      parameters:
        - name: x-linkedstore-hmac-sha256
          in: header
          required: true
          schema:
            type: string
          description: Tiendanube HMAC-SHA256 hex of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TiendanubeWebhookBody'
      responses:
        '200':
          description: Notification accepted (processing may continue asynchronously)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TiendanubeWebhookAckEnvelope'
        '400':
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

