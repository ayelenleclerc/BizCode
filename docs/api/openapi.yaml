            enum: [pending, picking, ready, assigned, in_transit, delivered, failed, cancelled]
        - name: zonaId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: driverId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: fecha
