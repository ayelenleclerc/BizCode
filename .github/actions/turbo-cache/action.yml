name: Turbo cache
description: Restore and save Turborepo local cache (.turbo) for CI runs
runs:
  using: composite
  steps:
    - name: Cache Turborepo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-turbo-
