name: Deploy Containers

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'Dockerfile.frontend'
      - 'docker-compose*.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      run_deploy:
        description: Run SSH deploy to production (requires DEPLOY_* secrets and production environment approval)
        required: false
        default: false
        type: boolean
      deploy_ssh_port:
        description: SSH port on the deploy host
        required: false
        default: '22'
        type: string
  release:
    types: [published]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore Turborepo cache
        uses: ./.github/actions/turbo-cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run type-check
        run: pnpm run type-check

      - name: Run lint
        run: pnpm exec turbo run lint

      - name: Run tests
        run: pnpm run test

      - name: Check i18n parity
        run: pnpm run check:i18n

      - name: Check docs locale map
        run: pnpm run check:docs-map

      - name: Validate OpenAPI/documentation sync
        run: pnpm run docs:validate

      - name: Build backend image
        run: docker build -f Dockerfile -t bizcode-server:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend --build-arg VITE_API_URL=/api -t bizcode-frontend:${{ github.sha }} .

      - name: Trivy scan backend image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: bizcode-server:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Trivy scan frontend image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: bizcode-frontend:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  publish_images:
    name: Publish GHCR Images
    runs-on: ubuntu-latest
    needs: build_and_test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (server)
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bizcode-server
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Extract Docker metadata (frontend)
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bizcode-frontend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: publish_images
    # Manual production deploy: workflow_dispatch + run_deploy=true + Environment approval.
    environment: production
    if: github.event_name == 'workflow_dispatch' && inputs.run_deploy == true
    permissions:
      contents: read
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ inputs.deploy_ssh_port }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      - name: Deployment summary
        run: 'echo "Production deploy finished for ref $GITHUB_REF (Environment: production)"'
