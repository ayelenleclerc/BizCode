name: Plan markdown validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  plan-validate:
    name: Validate Cursor plan fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: plan:validate
        run: pnpm run plan:validate
