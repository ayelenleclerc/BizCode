# Revisión periódica de dependencias: audit + listado outdated (no modifica lockfile).
# Las reglas de Cursor no ejecutan cron; este workflow sí.
name: Dependency maintenance

on:
  schedule:
    # Lunes 06:00 UTC — semanal; ajustar si se prefiere quincenal/mensual
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: pnpm audit & outdated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (blocking HIGH+)
        run: pnpm audit --audit-level=high

      - name: pnpm outdated (informational)
        continue-on-error: true
        run: pnpm outdated || true
